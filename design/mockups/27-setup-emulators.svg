<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>First-run Setup: emulators</title><defs><radialGradient id="rg1" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#8B7BFF" stop-opacity="0.18"/><stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/></radialGradient><linearGradient id="lg2" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#6A3FB5" stop-opacity="1"/><stop offset="1" stop-color="#0B0D12" stop-opacity="1"/></linearGradient><linearGradient id="lg3" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#E60012" stop-opacity="1"/><stop offset="1" stop-color="#0B0D12" stop-opacity="1"/></linearGradient><linearGradient id="lg4" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#2443B8" stop-opacity="1"/><stop offset="1" stop-color="#0B0D12" stop-opacity="1"/></linearGradient></defs><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#0B0D12" fill-opacity="1"/><rect x="0.0" y="0.0" width="1920.0" height="520.0" rx="0" fill="url(#rg1)" fill-opacity="1"/><text x="96" y="72" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#F2F4F8" letter-spacing="1">GAME<tspan fill="#8B7BFF">37</tspan></text><text x="246.0" y="70.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Setup · step 2 of 5</text><rect x="1564.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#8B7BFF" fill-opacity="1"/><rect x="1618.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#FFFFFF" fill-opacity="1"/><rect x="1672.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#2A3142" fill-opacity="1"/><rect x="1726.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#2A3142" fill-opacity="1"/><rect x="1780.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#2A3142" fill-opacity="1"/><text x="94.0" y="200.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">Install the emulators</text><text x="96.0" y="244.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">These Systems run in their own emulator, installed with Flatpak.</text><rect x="96.0" y="296.0" width="1200.0" height="96.0" rx="14" fill="#151922" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><rect x="120.0" y="318.0" width="52.0" height="52.0" rx="10.4" fill="url(#lg2)" fill-opacity="1"/><circle cx="156.4" cy="333.6" r="13.5" fill="#FFFFFF" fill-opacity="0.1"/><text x="196.0" y="340.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">GameCube</text><text x="196.0" y="370.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Dolphin</text><text x="536.0" y="352.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">org.DolphinEmu.dolphin-emu</text><text x="1268.0" y="352.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#3DDC84" fill-opacity="1" text-anchor="end" letter-spacing="0">Installed</text><path d="M1117.2,345 l6,6 l12,-13" fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="96.0" y="408.0" width="1200.0" height="96.0" rx="14" fill="#151922" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><rect x="120.0" y="430.0" width="52.0" height="52.0" rx="10.4" fill="url(#lg3)" fill-opacity="1"/><circle cx="156.4" cy="445.6" r="13.5" fill="#FFFFFF" fill-opacity="0.1"/><text x="196.0" y="452.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">Switch</text><text x="196.0" y="482.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Ryubing</text><text x="536.0" y="464.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">io.github.ryubing.Ryujinx</text><text x="1268.0" y="464.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#FFB020" fill-opacity="1" text-anchor="end" letter-spacing="0">Not installed</text><circle cx="1078.4" cy="457.0" r="6.0" fill="#FFB020" fill-opacity="1"/><rect x="96.0" y="520.0" width="1200.0" height="96.0" rx="14" fill="#151922" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><rect x="120.0" y="542.0" width="52.0" height="52.0" rx="10.4" fill="url(#lg4)" fill-opacity="1"/><circle cx="156.4" cy="557.6" r="13.5" fill="#FFFFFF" fill-opacity="0.1"/><text x="196.0" y="564.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">PlayStation 2</text><text x="196.0" y="594.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">PCSX2</text><text x="536.0" y="576.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">net.pcsx2.PCSX2</text><text x="1268.0" y="576.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#FFB020" fill-opacity="1" text-anchor="end" letter-spacing="0">Not installed</text><circle cx="1078.4" cy="569.0" r="6.0" fill="#FFB020" fill-opacity="1"/><text x="96.0" y="676.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="1.5">INSTALL THE MISSING ONES</text><rect x="96.0" y="696.0" width="838.2" height="48.0" rx="10" fill="#000000" fill-opacity="0.4"/><text x="116.0" y="727.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="600" fill="#5B6477" fill-opacity="1" text-anchor="start" letter-spacing="0">$</text><text x="138.0" y="727.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="18" font-weight="500" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">flatpak install flathub io.github.ryubing.Ryujinx net.pcsx2.PCSX2</text><rect x="949.2" y="691.0" width="140.0" height="58.0" rx="15" fill="none" fill-opacity="1" stroke="#8B7BFF" stroke-width="3"/><rect x="954.2" y="696.0" width="130.0" height="48.0" rx="10" fill="#1F2431" fill-opacity="1"/><rect x="976.2" y="709.0" width="14.0" height="17.0" rx="3" fill="none" fill-opacity="1" stroke="#F2F4F8" stroke-width="2"/><rect x="981.2" y="714.0" width="14.0" height="17.0" rx="3" fill="#1F2431" fill-opacity="1" stroke="#F2F4F8" stroke-width="2"/><text x="1010.2" y="727.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">Copy</text><rect x="1104.2" y="696.0" width="168.0" height="48.0" rx="10" fill="none" fill-opacity="1" stroke="#2A3142" stroke-width="2"/><path d="M1138.2,712 a9,9 0 1,0 3,7" fill="none" stroke="#F2F4F8" stroke-width="2.4" stroke-linecap="round"/><path d="M1134.2,707 l5,5 l-6,3" fill="none" stroke="#F2F4F8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="1156.2" y="727.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">Check again</text><text x="96.0" y="800.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">You can continue now and install them later. Missing emulators show on the Carousel.</text><rect x="1635.8" y="906.0" width="188.2" height="64.0" rx="32" fill="#8B7BFF" fill-opacity="1"/><text x="1729.9" y="946.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">Continue</text><rect x="1459.8" y="906.0" width="160.0" height="64.0" rx="32" fill="#151922" fill-opacity="0.85" stroke="#2A3142" stroke-width="2"/><text x="1539.8" y="946.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">Back</text><rect x="0.0" y="1010.0" width="1920.0" height="70.0" rx="0" fill="#0B0D12" fill-opacity="0.92"/><rect x="0.0" y="1010.0" width="1920.0" height="1.0" rx="0" fill="#2A3142" fill-opacity="1"/><text x="1785.1" y="1052.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Back</text><circle cx="1757.1" cy="1046.0" r="16.0" fill="#1F2431" fill-opacity="1" stroke="#F2F4F8" stroke-width="2"/><text x="1757.1" y="1052.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">B</text><text x="1623.4" y="1052.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Continue</text><rect x="1571.4" y="1032.0" width="40.0" height="28.0" rx="8" fill="#1F2431" fill-opacity="1" stroke="#F2F4F8" 