hoose .exe</text><text x="1042.0" y="432.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFB020" fill-opacity="1" text-anchor="end" letter-spacing="0">Not found</text><rect x="96.0" y="500.0" width="1200.0" height="96.0" rx="14" fill="#151922" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><text x="124.0" y="540.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">PCSX2</text><text x="124.0" y="570.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">PlayStation 2</text><text x="1268.0" y="540.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#3DDC84" fill-opacity="1" text-anchor="end" letter-spacing="0">Found</text><path d="M1182.6,533 l6,6 l12,-13" fill="none" stroke="#3DDC84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1268.0" y="570.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="end" letter-spacing="0">C:\Program Files\PCSX2\pcsx2-qt.exe</text><rect x="96.0" y="608.0" width="1200.0" height="96.0" rx="14" fill="#151922" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><text x="124.0" y="648.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">Dolphin</text><text x="124.0" y="678.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">GameCube, Wii</text><rect x="1058.0" y="630.0" width="210.0" height="52.0" rx="10" fill="#1F2431" fill-opacity="1" stroke="#2A3142" stroke-width="2"/><text x="1163.0" y=