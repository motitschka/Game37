<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>First-run Setup: emulators (Windows)</title><defs><radialGradient id="rg1" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#8B7BFF" stop-opacity="0.18"/><stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/></radialGradient></defs><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#0B0D12" fill-opacity="1"/><rect x="0.0" y="0.0" width="1920.0" height="520.0" rx="0" fill="url(#rg1)" fill-opacity="1"/><text x="96" y="72" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#F2F4F8" letter-spacing="1">GAME<tspan fill="#8B7BFF">37</tspan></text><text x="246.0" y="70.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Setup · step 2 of 5</text><rect x="1564.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#8B7BFF" fill-opacity="1"/><rect x="1618.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#FFFFFF" fill-opacity="1"/><rect x="1672.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#2A3142" fill-opacity="1"/><rect x="1726.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#2A3142" fill-opacity="1"/><rect x="1780.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#2A3142" fill-opacity="1"/><text x="94.0" y="200.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">Set up the emulators</text><text x="96.0" y="244.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">These Systems run in their own emulator. Game37 looks for each one; pick its program if it isn&#x27;t found.</text><rect x="96.0" y="284.0" width="1200.0" height="96.0" rx="14" fill="#1F2431" fill-opacity="1" stroke="#2