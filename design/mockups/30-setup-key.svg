<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>First-run Setup: SteamGridDB key</title><defs><radialGradient id="rg1" cx="0.5" cy="0" r="0.9"><stop offset="0" stop-color="#8B7BFF" stop-opacity="0.18"/><stop offset="1" stop-color="#8B7BFF" stop-opacity="0"/></radialGradient></defs><rect x="0.0" y="0.0" width="1920.0" height="1080.0" rx="0" fill="#0B0D12" fill-opacity="1"/><rect x="0.0" y="0.0" width="1920.0" height="520.0" rx="0" fill="url(#rg1)" fill-opacity="1"/><text x="96" y="72" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#F2F4F8" letter-spacing="1">GAME<tspan fill="#8B7BFF">37</tspan></text><text x="246.0" y="70.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Setup · step 5 of 5</text><rect x="1564.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#8B7BFF" fill-opacity="1"/><rect x="1618.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#8B7BFF" fill-opacity="1"/><rect x="1672.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#8B7BFF" fill-opacity="1"/><rect x="1726.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#8B7BFF" fill-opacity="1"/><rect x="1780.0" y="60.0" width="44.0" height="8.0" rx="4" fill="#FFFFFF" fill-opacity="1"/><text x="94.0" y="200.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">Add a SteamGridDB key (optional)</text><text x="96.0" y="244.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">With a free SteamGridDB API key, Game37 fetches covers and banners for your Games. Without one, Games show their title and System.</text><text x="96.0" y="316.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="1.5">WHERE TO GET ONE</text><rect x="96.0" y="336.0" width="238.0" height="48.0" rx="24" fill="#1F2431" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><text x="215.0" y="367.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">steamgriddb.com</text><text x="352.0" y="367.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#8A93A6" fill-opacity="1" text-anchor="middle" letter-spacing="0">→</text><rect x="370.0" y="336.0" width="132.4" height="48.0" rx="24" fill="#1F2431" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><text x="436.2" y="367.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">Profile</text><text x="520.4" y="367.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#8A93A6" fill-opacity="1" text-anchor="middle" letter-spacing="0">→</text><rect x="538.4" y="336.0" width="185.2" height="48.0" rx="24" fill="#1F2431" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><text x="631.0" y="367.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">Preferences</text><text x="741.6" y="367.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#8A93A6" fill-opacity="1" text-anchor="middle" letter-spacing="0">→</text><rect x="759.6" y="336.0" width="79.6" height="48.0" rx="24" fill="#1F2431" fill-opacity="1" stroke="#2A3142" stroke-width="1"/><text x="799.4" y="367.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">API</text><text x="96.0" y="452.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="1.5">API KEY</text><rect x="96.0" y="472.0" width="900.0" height="72.0" rx="14" fill="#1F2431" fill-opacity="1" stroke="#8B7BFF" stroke-width="3"/><text x="124.0" y="518.0" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="26" font-weight="500" fill="#F2F4F8" fill-opacity="1" text-anchor="start" letter-spacing="0">••••••••••••••••••••••••••••3f9a</text><rect x="627.2" y="492.0" width="3.0" height="32.0" rx="1" fill="#8B7BFF" fill-opacity="1"/><text x="96.0" y="584.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Saved to ~/.config/game37/secrets.toml on this device only</text><rect x="1664.0" y="906.0" width="160.0" height="64.0" rx="32" fill="#8B7BFF" fill-opacity="1"/><text x="1744.0" y="946.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">Finish</text><rect x="1488.0" y="906.0" width="160.0" height="64.0" rx="32" fill="#151922" fill-opacity="0.85" stroke="#2A3142" stroke-width="2"/><text x="1568.0" y="946.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">Skip</text><rect x="1312.0" y="906.0" width="160.0" height="64.0" rx="32" fill="#151922" fill-opacity="0.85" stroke="#2A3142" stroke-width="2"/><text x="1392.0" y="946.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">Back</text><rect x="0.0" y="1010.0" width="1920.0" height="70.0" rx="0" fill="#0B0D12" f