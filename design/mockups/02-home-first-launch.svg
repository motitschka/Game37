 sans-serif" font-size="22" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Fills up as you play. Ordered by playtime.</text><rect x="0.0" y="1010.0" width="1920.0" height="70.0" rx="0" fill="#0B0D12" fill-opacity="0.92"/><rect x="0.0" y="1010.0" width="1920.0" height="1.0" rx="0" fill="#2A3142" fill-opacity="1"/><text x="1765.7" y="1052.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Search</text><rect x="1713.7" y="1032.0" width="40.0" height="28.0" rx="8" fill="#1F2431" fill-opacity="1" stroke="#F2F4F8" stroke-width="2"/><text x="1733.7" y="1051.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">L3</text><text x="1566.8" y="1052.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" fill="#8A93A6" fill-opacity="1" text-anchor="start" letter-spacing="0">Switch view</text><rect x="1514.8" y="1032.0" width="40.0" height="28.0" rx="8" fill="#1F2431" fill-opacity="1" stroke="#F2F4F8" stroke-width="2"/><text x="1534.8" y="1051.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">R1</text><rect x="1468.8" y="1032.0" width="40.0" height="28.0" rx="8" fill="#1F2431" fill-opacity="1" stroke="#F2F4F8" stroke-width="2"/><text x="1488.8" y="1051.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#F2F4F8" fill-opacity="1" text-anchor="middle" letter-spacing="0">L1</text></svg>